name: Build Windows Executable

on:
  push:
    branches: [ build-github-actions ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install MinGW from winlibs
        run: |
          curl -L -o mingw.zip https://github.com/brechtsanders/winlibs_mingw/releases/download/15.2.0posix-13.0.0-ucrt-r3/winlibs-i686-posix-dwarf-gcc-15.2.0-mingw-w64ucrt-13.0.0-r3.zip
          mkdir C:\mingw
          tar -xf mingw.zip -C C:\mingw
          echo "C:\mingw\mingw32\bin" >> $env:GITHUB_PATH
      - name: Verify MinGW installation
        run: g++ --version
      - name: Verify working directory
        run: dir
      - name: Run build script
        run: .\windows_build.bat
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            *.exe
